<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Background Badge for High Contrast in any browser theme -->
  <rect width="100" height="100" rx="24" fill="#0B1329" />
  
  <!-- Central Solar Core -->
  <circle cx="50" cy="50" r="14" fill="url(#solarGrad)" />
  <circle cx="50" cy="50" r="18" stroke="url(#solarGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Microgrid Connection Nodes and Traces -->
  <line x1="50" y1="32" x2="50" y2="17" stroke="url(#gridGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="14" r="3.5" fill="#06B6D4" />

  <line x1="63" y1="37" x2="74" y2="26" stroke="url(#solarGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="76" cy="24" r="3" fill="#FBBF24" />

  <line x1="68" y1="50" x2="83" y2="50" stroke="url(#gridGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="86" cy="50" r="3.5" fill="#10B981" />

  <line x1="63" y1="63" x2="74" y2="74" stroke="url(#solarGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="76" cy="76" r="3" fill="#F59E0B" />

  <line x1="50" y1="68" x2="50" y2="83" stroke="url(#gridGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="86" r="3.5" fill="#06B6D4" />

  <line x1="37" y1="63" x2="26" y2="74" stroke="url(#solarGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="76" r="3" fill="#FBBF24" />

  <line x1="32" y1="50" x2="17" y2="50" stroke="url(#gridGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="14" cy="50" r="3.5" fill="#10B981" />

  <line x1="37" y1="37" x2="26" y2="26" stroke="url(#solarGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="24" r="3" fill="#F59E0B" />

  <!-- Microgrid Outer Interconnect Loop -->
  <path d="M 50 14 L 76 24 L 86 50 L 76 76 L 50 86 L 24 76 L 14 50 L 24 24 Z"
        stroke="url(#gridGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45" fill="none" />
</svg>